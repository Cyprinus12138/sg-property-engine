name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (gofmt, vet, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags=smoke ./...
      - name: go test
        run: go test -count=1 ./...

  smoke:
    name: Smoke (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Smoke tests
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        # Serialise packages: each test clones a template database, and the
        # template is created once per process behind an advisory lock.
        run: go test -tags=smoke -count=1 -p 1 ./...

  launcher:
    name: Launcher (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [compose, docker, local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.mode == 'local'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: shellcheck
        if: matrix.mode == 'compose'
        run: shellcheck scripts/*.sh
      # nearby_mrt reads only the database, so the backfill exercises the
      # trigger path without calling any upstream API from CI.
      - name: up
        run: scripts/stack.sh up ${{ matrix.mode }} --backfill nearby_mrt
      - name: status
        run: |
          scripts/stack.sh status
          curl -fsS localhost:8081/sync/status | grep -q '"source":"nearby_mrt"'
      - name: logs on failure
        if: failure()
        run: |
          docker ps -a
          cat .sgpe/sgpe.log 2>/dev/null || true
          docker compose logs 2>/dev/null || true
          docker logs sgpe-engine 2>/dev/null || true
      - name: down
        if: always()
        run: scripts/stack.sh down --purge
